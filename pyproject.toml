[project]
name = "clipsearch"
version = "0.1.0"
description = "Evaluating text-to-image search: keyword tags vs CLIP vs hybrid vs a trained adapter, with bootstrap confidence intervals and failure analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "torch>=2.2", "open-clip-torch>=2.24", "pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

# CPU-only PyTorch wheels on Linux (CI), instead of the multi-gigabyte CUDA build
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
